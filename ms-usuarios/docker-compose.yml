services:
  ms-usuarios:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db:3306/usuarios_db
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: usuarios_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
