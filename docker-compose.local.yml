services:

  # ─── Bases de datos ───────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: mysql_local
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: usuarios_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo_local
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15
    container_name: postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: partidas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  # ─── Microservicios ───────────────────────────────────────────────

  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms_usuarios
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@mysql:3306/usuarios_db
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  ms-juegos:
    build: ./ms-juegos
    container_name: ms_juegos
    ports:
      - "8002:8002"
    environment:
      - MONGO_URL=mongodb://mongo:27017/juegos_db
    depends_on:
      - mongo
    restart: on-failure

  ms-partidas:
    build: ./ms-partidas
    container_name: ms_partidas
    ports:
      - "8003:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/partidas_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - MS_JUEGOS_URL=http://ms-juegos:8002
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  ms-ranking:
    build: ./ms-ranking
    container_name: ms_ranking
    ports:
      - "8004:8004"
    environment:
      - MS_USUARIOS_URL=http://ms-usuarios:8001
      - MS_PARTIDAS_URL=http://ms-partidas:8080
    depends_on:
      - ms-usuarios
      - ms-partidas
    restart: on-failure

  ms-analytics:
    build: ./ms-analytics
    container_name: ms_analytics
    ports:
      - "8005:8005"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION=us-east-1
      - ATHENA_DATABASE=game_analytics
      - S3_OUTPUT=s3://game-analytics-data-5/athena-results/
    restart: on-failure

volumes:
  mysql_data:
  mongo_data:
  postgres_data:
